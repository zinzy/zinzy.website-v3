{{ define "main" }} {{ partial "back_link.html" .}}

<div>
  <article class="h-entry">
    <header>
      <div class="u-author h-card hidden">
        <img src="/img/avatar.jpg" class="u-photo" />
        <span class="u-url p-name">Zinzy Waleson Geene</span>
      </div>
    </header>

    <content class="e-content"> {{- partial "content_wikified" . -}} </content>

    <section>
      <h3>Top songs</h3>
      <ul>
        {{ range .Params.songs }}

        <li>
          "{{ .title }}" by {{ .artist }} {{ if .count }}({{ .count }} times){{
          end }}
        </li>
        {{ end }}
      </ul>
    </section>
  </article>

  <footer class="page-footer">
    <ul>
      <li><a href="/hello">Say hello</a></li>
      <li>Follow via <a href="/index.xml">RSS</a></li>
    </ul>
  </footer>
</div>
{{ end }}
